<!DOCTYPE html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tipos de Listas em HTML</title>
  </head>

  <body>

    <h1>Tipos de Listas em HTML</h1>
    
    <h2>Listas Desordandas - Unordered List (UL)</h2>
    <ul>
      <li>Apple</li>
      <li>Banana</li>
      <li>Avocado</li>
    </ul>
    
    <h2>Listas Ordenadas - Ordered List (OL)</h2>
    <ol>
      <li>Mark</li>
      <li>Anna</li>
      <li>José</li>
    </ol>

    <h2>Lista com Descrição - Description List (DL)</h2>
    <dl>
      <dt>Coffe</dt>
      <dd>Black hot drink</dd>
      <dt>Milk</dt>
      <dd>White hot drink</dd>
    </dl>

    <h2>Código-fonte da página</h2>
    <img src="image.png" alt="print do código desta página">
        
    <script src="main.js"></script>
  </body>

</html>
